<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N-Hub</title>
<meta name="theme-color" content="#131418" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N-Hub">
<!-- the app paints the strip behind the status bar itself (light text on it) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131418; }
  #top { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: #131418; z-index: 2; }
  #app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
         width: 100%; height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border: 0; display: block; }
</style>
<script>
  // N-Hub opens inside this page so the phone's top bar can follow the app's light / dark mode.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxm5uZenuKkPbjNIWuq_yIppneArYj3fK8udXVmDU7OvhTn-QuabHJQWdAsvPXaTwsybg/exec';
  // status-bar text is white, so light mode gets the app's navy strip instead of white
  var THEMES = { dark: { bg: '#131418', top: '#131418' }, light: { bg: '#f5f6f8', top: '#1d2c4d' } };
  function paint(theme) {
    var t = THEMES[theme] || THEMES.dark;
    document.getElementById('tc').setAttribute('content', t.top);
    document.documentElement.style.background = t.bg;
    if (document.body) document.body.style.background = t.bg;
    var top = document.getElementById('top'); if (top) top.style.background = t.top;
    document.documentElement.setAttribute('data-theme', theme);
  }
  var saved = null;
  try { saved = localStorage.getItem('nhubTheme'); } catch (e) {}
  var start = saved || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  paint(start);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || (d.nhubTheme !== 'dark' && d.nhubTheme !== 'light')) return;
    paint(d.nhubTheme);
    try { localStorage.setItem('nhubTheme', d.nhubTheme); } catch (err) {}
  });
</script>
</head>
<body>
<div id="top"></div>
<iframe id="app" title="N-Hub" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  paint(document.documentElement.getAttribute('data-theme') || start);
  document.getElementById('app').src = APP_URL;
</script>
</body>
</html>
