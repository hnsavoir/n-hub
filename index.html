<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N-Hub</title>
<meta name="theme-color" content="#131418" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N-Hub">
<!-- "black" (not translucent): with translucent, iOS home-screen apps get a page that stops one status-bar height short of the bottom, so the menu could never reach it -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131418; }
  #top { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: #131418; z-index: 2; }
  /* the app runs to the very bottom of the screen; it keeps its menu clear of the home bar itself (see nhubInset) */
  #app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: 0;
         width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; display: block; }
  #probe { position: fixed; left: 0; bottom: 0; width: 1px; height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
</style>
<script>
  // N-Hub opens inside this page so the phone's top bar can follow the app's light / dark mode.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxm5uZenuKkPbjNIWuq_yIppneArYj3fK8udXVmDU7OvhTn-QuabHJQWdAsvPXaTwsybg/exec';
  // status-bar text is white, so light mode gets the app's navy strip instead of white
  var THEMES = { dark: { bg: '#131418', top: '#131418' }, light: { bg: '#f5f6f8', top: '#1d2c4d' } };
  function paint(theme) {
    var t = THEMES[theme] || THEMES.dark;
    document.getElementById('tc').setAttribute('content', t.top);
    document.documentElement.style.background = t.bg;
    if (document.body) document.body.style.background = t.bg;
    var top = document.getElementById('top'); if (top) top.style.background = t.top;
    document.documentElement.setAttribute('data-theme', theme);
  }
  var saved = null;
  try { saved = localStorage.getItem('nhubTheme'); } catch (e) {}
  var start = saved || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  paint(start);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || (d.nhubTheme !== 'dark' && d.nhubTheme !== 'light')) return;
    paint(d.nhubTheme);
    try { localStorage.setItem('nhubTheme', d.nhubTheme); } catch (err) {}
  });
</script>
</head>
<body>
<div id="top"></div>
<div id="probe"></div>
<div id="dbg" style="position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:9;font:11px/1.3 -apple-system,monospace;color:#ff6;background:rgba(0,0,0,.6);padding:2px 6px;pointer-events:none;white-space:pre"></div>
<iframe id="app" title="N-Hub" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  paint(document.documentElement.getAttribute('data-theme') || start);
  document.getElementById('app').src = APP_URL;
  // The app sits two frames deep (Apps Script) and cannot see the phone's home-bar area, so tell it how tall it is.
  function sendInset() {
    var px = insets().bot;
    var walk = function (w, depth) {
      try { w.postMessage({ nhubInset: px }, '*'); } catch (e) {}
      if (depth > 3) return;
      try { for (var i = 0; i < w.frames.length; i++) walk(w.frames[i], depth + 1); } catch (e) {}
    };
    var f = document.getElementById('app').contentWindow; if (f) walk(f, 0);
  }
  var tries = 0, timer = setInterval(function () { sendInset(); if (++tries > 30) clearInterval(timer); }, 1000);
  document.getElementById('app').addEventListener('load', function () { tries = 0; sendInset(); });
  window.addEventListener('resize', sendInset); window.addEventListener('orientationchange', function () { setTimeout(sendInset, 300); });
  // Size the frame in real pixels from the phone's own screen height (iOS home-screen apps can get 100% wrong),
  // then, if the app reports it is shorter than this frame (Apps Script leaves a strip at the bottom), stretch by the gap.
  var extra = 0, lastH = 0;
  function dbg() { try { var a = document.getElementById('app').getBoundingClientRect(), vv = window.visualViewport;
    document.getElementById('dbg').textContent = 'iH ' + innerHeight + ' cH ' + document.documentElement.clientHeight + ' sH ' + screen.height + ' vv ' + (vv ? Math.round(vv.height) : '-') + ' st ' + (navigator.standalone ? 1 : 0) +
      '\nframe ' + Math.round(a.top) + '+' + Math.round(a.height) + ' app ' + lastH + ' extra ' + extra + ' top ' + Math.round(document.getElementById('top').getBoundingClientRect().height) + ' bot ' + insets().bot; } catch (e) {} }
  setInterval(dbg, 1000);
  function insets() {
    var top = document.getElementById('top').getBoundingClientRect().height || 0;
    var bot = Math.round(parseFloat(getComputedStyle(document.getElementById('probe')).paddingBottom) || 0);
    // translucent status bar on iOS: the page is one status-bar height short of the screen and never reaches the home bar
    var short = top > 0 && window.screen && screen.height - window.innerHeight > 20;
    return { top: top, bot: short ? 0 : bot };
  }
  function fit() {
    var app = document.getElementById('app');
    var h = window.innerHeight - insets().top;
    app.style.top = insets().top + 'px'; app.style.bottom = 'auto'; app.style.height = (h + extra) + 'px';
  }
  fit(); [300, 1000, 2500].forEach(function (ms) { setTimeout(fit, ms); });
  window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d !== 'object' || !d.nhubAskInset) return;
    sendInset();
    if (typeof d.nhubH === 'number') lastH = d.nhubH;
    if (typeof d.nhubH === 'number' && d.nhubH > 200) {
      var cur = document.getElementById('app').getBoundingClientRect().height;
      var gap = Math.round(cur - d.nhubH);   // strip Apps Script keeps below the app
      if (gap > 3 && Math.abs(gap - extra) >= 2) { extra = Math.min(160, gap); fit(); }
    }
  });
</script>
</body>
</html>
